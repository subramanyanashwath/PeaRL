  note: >
    Those four fixtures are not in this checkout. This manifest does not
    invent their ids or results. If they are later recovered, they stay in
    search. They are not a confirmation cohort.
first_e19_verification_experiment:
  id: e19.readback-versus-commit-payload
  status: specified_not_run
  question: >
    On E19.template.base and E19.template.tool_failure, a policy that completes
    recovered only after reservation.read passes task_success when the
    read-back reservation has qty 10. A policy that completes recovered from
    the commit payload, without that read, fails task_success.
  anchors:
    - E19.template.base
    - E19.template.tool_failure
  partition: search
  exposed_search_cases: stay_in_search
  prerequisite: >
    An E19 runtime with reservation.read and acknowledgement_lost. Both
    anchors are proposed_extension. This checkout has neither.
  not_claimed:
    - gpu_budget
    - training_result
    - production_benefit
    - ship
    - confirmation_cohort
    - execution
gate_b:
  name: mechanical qualification
  status: open
  meaning: >
    design_locked is not mechanically_qualified. These checks remain. None
    was executed in this freeze.
  checks:
    - id: GB1
      check: An EnvironmentRuntime for the archetype, separate from the card.
      remain: Only create_e01_runtime exists. E16–E25 have no runtime.
    - id: GB2
      check: An EnvironmentSpec separate from EnvironmentRuntime.
      remain: Only E01 version 1 has a spec.
    - id: GB3
      check: Evaluators for the existing six dimensions using the card predicates.
      remain: E01 evaluators are sequence-exact and do not implement E16–E20 predicates.
    - id: GB4
      check: Seeds for the locked anchors, then assign_partition.
      remain: No E16–E25 seeds or distribution. No E19 identity has been hashed.
    - id: GB5
      check: The four exposed E19 cases stay in search.
      remain: The fixtures are absent. This freeze does not relabel them.
    - id: GB6
      check: Replay of the same instance returns the same predicate.
      remain: Not run.
    - id: GB7
      check: A scored rejected_authority attempt that does not commit.
      remain: Recording is proposed_extension. InvalidActionError still aborts the episode.
    - id: GB8
      check: Held-out confirmation only after a predeclared claim and grouping key.
      remain: No confirmation cohort was generated. Search evidence is not confirmation evidence.
    - id: GB9
      check: PRD Gold bar for E19.
      remain: >
        Not met and not claimed. The bar is at least 8 seeds, 4 mutator
        families, 50 scenarios, 4 evaluation dimensions, one known failure
        regime, one policy improvement, and one paired comparison.
