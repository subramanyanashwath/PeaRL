<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PeaRL — environment-centric improvement for AI agents</title>
  <desc id="desc">A restrained indigo, violet, sky, amber, and green banner introducing PeaRL with current project proof: 25 registry environments, 93 tests, and Python 3.11 and 3.12 support.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(194 72) rotate(46) scale(400 290)">
      <stop stop-color="#7c3aed" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 475) rotate(-130) scale(360 250)">
      <stop stop-color="#f59e0b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4f46e5" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#paper)"/>
  <rect width="1200" height="520" rx="28" fill="url(#violet-glow)"/>
  <rect width="1200" height="520" rx="28" fill="url(#amber-glow)"/>

  <g transform="translate(76 62)">
    <g aria-hidden="true">
      <circle cx="18" cy="18" r="18" fill="#4f46e5"/>
      <circle cx="18" cy="18" r="11" fill="#eef2ff"/>
      <circle cx="18" cy="18" r="5" fill="#7c3aed"/>
    </g>
    <text x="52" y="23" fill="#4f46e5" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2.2">ENVIRONMENT-CENTRIC AGENT IMPROVEMENT</text>

    <text x="0" y="150" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="-5">PeaRL</text>

    <text x="2" y="208" fill="#334155" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500">
      Real workflows are environments—
    </text>
    <text x="2" y="244" fill="#334155" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500">
      not prompt-response test cases.
    </text>

    <g transform="translate(2 294)" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17">
      <rect x="0" y="0" width="128" height="42" rx="21" fill="#e0e7ff"/>
      <circle cx="22" cy="21" r="5" fill="#4f46e5"/>
      <text x="36" y="27" fill="#3730a3" font-weight="700">Local-first</text>

      <rect x="140" y="0" width="190" height="42" rx="21" fill="#e0f2fe"/>
      <circle cx="162" cy="21" r="5" fill="#0ea5e9"/>
      <text x="176" y="27" fill="#075985" font-weight="700">Provider-neutral</text>

      <rect x="342" y="0" width="184" height="42" rx="21" fill="#dcfce7"/>
      <circle cx="364" cy="21" r="5" fill="#16a34a"/>
      <text x="378" y="27" fill="#166534" font-weight="700">Evidence-gated</text>
    </g>

    <text x="2" y="394" fill="#64748b" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17">
      Specify the work. Observe the behavior. Improve what the evidence supports.
    </text>
  </g>

  <g transform="translate(790 72)" filter="url(#shadow)">
    <rect width="332" height="376" rx="24" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="30" y="45" fill="#64748b" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.7">CURRENT BUILD</text>
    <text x="30" y="80" fill="#0f172a" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700">Specification + Registry</text>
    <line x1="30" y1="103" x2="302" y2="103" stroke="#e2e8f0"/>

    <text x="30" y="148" fill="#64748b" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15">Registry slots</text>
    <text x="302" y="151" fill="#4f46e5" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">25 / 25</text>

    <text x="30" y="212" fill="#64748b" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15">Passing tests</text>
    <text x="302" y="215" fill="#7c3aed" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">93 / 93</text>

    <text x="30" y="276" fill="#64748b" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15">Python</text>
    <text x="302" y="279" fill="#0ea5e9" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">3.11 + 3.12</text>

    <rect x="30" y="313" width="272" height="42" rx="10" fill="#fff7ed"/>
    <circle cx="49" cy="334" r="5" fill="#f59e0b"/>
    <text x="63" y="340" fill="#9a3412" font-family="SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing=".55">PRE-ALPHA · BUILDING IN PUBLIC</text>
  </g>
</svg>
